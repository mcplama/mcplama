# App front door: serves the built dashboard and reverse-proxies every backend
# path to the FastAPI container on the internal network. One origin, so the
# httpOnly auth cookie and MCP OAuth discovery both work without CORS gymnastics.
server {
    listen 80;
    server_name _;
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /usr/share/nginx/html;
    index index.html;

    # Backend paths. These sit at the app root (not under /api) because MCP
    # clients hit /connect, /authorize, /token and /.well-known directly.
    location /api/          { proxy_pass http://backend:8000; include /etc/nginx/backend_proxy.conf; }
    location /health        { proxy_pass http://backend:8000; include /etc/nginx/backend_proxy.conf; }
    location /docs          { proxy_pass http://backend:8000; include /etc/nginx/backend_proxy.conf; }
    location /redoc         { proxy_pass http://backend:8000; include /etc/nginx/backend_proxy.conf; }
    location /swagger       { proxy_pass http://backend:8000; include /etc/nginx/backend_proxy.conf; }
    location /openapi.json  { proxy_pass http://backend:8000; include /etc/nginx/backend_proxy.conf; }
    location /authorize     { proxy_pass http://backend:8000; include /etc/nginx/backend_proxy.conf; }
    location /token         { proxy_pass http://backend:8000; include /etc/nginx/backend_proxy.conf; }
    location /register      { proxy_pass http://backend:8000; include /etc/nginx/backend_proxy.conf; }
    location /.well-known/  { proxy_pass http://backend:8000; include /etc/nginx/backend_proxy.conf; }

    # /connect carries MCP traffic, including Server-Sent Events. Buffering must
    # be off and the read timeout long, or SSE streams stall / get cut.
    location /connect {
        proxy_pass http://backend:8000;
        include /etc/nginx/backend_proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # SPA: everything else is the React app; unknown routes fall back to index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
