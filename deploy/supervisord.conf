[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# ── PostgreSQL (Debian cluster style) ─────────────────────────────────────────
[program:postgres]
command=su postgres -c "/usr/lib/postgresql/17/bin/postgres -D /var/lib/postgresql/17/main -c config_file=/etc/postgresql/17/main/postgresql.conf"
autostart=true
autorestart=true
priority=1
stdout_logfile=/var/log/mcplama/postgres.log
stderr_logfile=/var/log/mcplama/postgres.log

# ── Container broker ──────────────────────────────────────────────────────────
# The only process that talks to /var/run/docker.sock. The backend has no direct
# Docker access and asks the broker to start MCP server containers; the broker
# builds every `docker run` argv itself, so no caller can request a bind mount or
# a privileged container. See docs/SECURITY-MODEL.md.
#
# NOTE: in this bundled single-container image the broker and the backend share a
# container. The broker remains the only process configured to use the socket,
# but a separately isolated deployment can provide a stronger boundary.
[program:broker]
command=python -m uvicorn app.broker.main:app --host 127.0.0.1 --port 9000 --workers 1
directory=/app/server
autostart=true
autorestart=true
priority=2
startretries=5
startsecs=3
stdout_logfile=/var/log/mcplama/broker.log
stderr_logfile=/var/log/mcplama/broker.log
environment=
    BROKER_TOKEN="%(ENV_BROKER_TOKEN)s",
    MCPLAMA_NETWORK="mcplama",
    RUNNER_IMAGE="%(ENV_RUNNER_IMAGE)s"

# ── Backend (FastAPI) ─────────────────────────────────────────────────────────
[program:backend]
command=python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1
directory=/app/server
autostart=true
autorestart=true
priority=3
startretries=5
startsecs=5
stdout_logfile=/var/log/mcplama/backend.log
stderr_logfile=/var/log/mcplama/backend.log
environment=
    DATABASE_URL="%(ENV_DATABASE_URL)s",
    SECRET_KEY="%(ENV_SECRET_KEY)s",
    TOKEN_ENCRYPTION_KEY="%(ENV_TOKEN_ENCRYPTION_KEY)s",
    GATEWAY_URL="%(ENV_GATEWAY_URL)s",
    REGISTRY_URL="%(ENV_REGISTRY_URL)s",
    CORS_ORIGINS="%(ENV_CORS_ORIGINS)s",
    BROKER_URL="http://127.0.0.1:9000",
    BROKER_HOST="%(ENV_BROKER_HOST)s",
    BROKER_TOKEN="%(ENV_BROKER_TOKEN)s",
    RUNNER_IMAGE="%(ENV_RUNNER_IMAGE)s"

# ── Nginx ─────────────────────────────────────────────────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=3
stdout_logfile=/var/log/mcplama/nginx.log
stderr_logfile=/var/log/mcplama/nginx.log
