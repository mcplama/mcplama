events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ── Rate limiting for auth / OAuth endpoints ────────────────────────────
    # Defense in depth alongside the app-level limiter on /auth/login.
    # /authorize, /token and /register (OAuth dynamic client registration)
    # have no app-level limiter, so this is their only protection.
    limit_req_zone $binary_remote_addr zone=authlimit:10m rate=20r/m;

    server {
        listen 8080;
        server_name _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self';" always;
        add_header X-Content-Type-Options "nosniff" always;

        # ── Frontend (React app) ──────────────────────────────────────────
        location / {
            root /app/ui/dist;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache static assets
            location ~* \.(js|css|png|jpg|ico|svg|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header Content-Security-Policy "frame-ancestors 'self';" always;
                add_header X-Content-Type-Options "nosniff" always;
            }
        }

        # ── Auth endpoints (rate-limited) ───────────────────────────────────
        location /api/v1/auth/login {
            limit_req zone=authlimit burst=10 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # ── Backend API ───────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # ── FastAPI interactive documentation ─────────────────────────────
        location /docs {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        location /redoc {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        location /swagger {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        location /openapi.json {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # ── MCP connect (SSE / streaming) ─────────────────────────────────
        location /connect/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── OAuth + well-known ────────────────────────────────────────────
        location /authorize {
            limit_req zone=authlimit burst=10 nodelay;
            proxy_pass http://127.0.0.1:8000;
        }
        location /token {
            limit_req zone=authlimit burst=10 nodelay;
            proxy_pass http://127.0.0.1:8000;
        }
        location /.well-known/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        # OAuth Dynamic Client Registration
        location /register {
            limit_req zone=authlimit burst=10 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        # ── Health ────────────────────────────────────────────────────────
        location /health {
            proxy_pass http://127.0.0.1:8000;
        }
    }
}
