<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">MCPlama architecture overview</title>
  <desc id="desc">AI clients and operators connect to the MCPlama gateway. The gateway checks access, applies credentials and policies, records audit events, and proxies requests to remote or containerized MCP servers. PostgreSQL stores persistent state. A separate broker alone accesses Docker to launch containers on the private MCPlama network.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#14213b"/>
    </linearGradient>
    <linearGradient id="gateway" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6046e8"/>
      <stop offset="1" stop-color="#3927a8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#80b6ff"/>
    </marker>
    <marker id="arrowControl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#b4a2ff"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill:#f5f7ff; font-size:42px; font-weight:750; }
      .subtitle { fill:#bfcae2; font-size:23px; }
      .label { fill:#bdc9e6; font-size:18px; font-weight:750; letter-spacing:2px; }
      .heading { fill:#f5f7ff; font-size:27px; font-weight:700; }
      .body { fill:#d0d9eb; font-size:21px; }
      .note { fill:#aebdda; font-size:18px; }
      .card { fill:#15223b; stroke:#35476d; stroke-width:2; }
      .flow { fill:none; stroke:#80b6ff; stroke-width:4; marker-end:url(#arrow); }
      .control { fill:none; stroke:#b4a2ff; stroke-width:4; marker-end:url(#arrowControl); }
    </style>
  </defs>
  <rect width="1400" height="940" rx="24" fill="url(#background)"/>
  <text x="56" y="72" class="title">MCPlama architecture</text>
  <text x="58" y="112" class="subtitle">One gateway for governed access to remote and containerized MCP servers</text>

  <text x="58" y="180" class="label">CLIENTS</text>
  <rect x="54" y="202" width="300" height="252" rx="20" class="card"/>
  <text x="82" y="248" class="heading">AI clients</text>
  <text x="82" y="292" class="body">Claude · Cursor</text>
  <text x="82" y="326" class="body">VS Code · other MCP apps</text>
  <rect x="82" y="360" width="244" height="60" rx="12" fill="#1c3155" stroke="#42689e" stroke-width="2"/>
  <text x="101" y="398" class="body">MCP connection</text>

  <rect x="54" y="490" width="300" height="220" rx="20" class="card"/>
  <text x="82" y="536" class="heading">People</text>
  <text x="82" y="580" class="body">Admin and member portal</text>
  <text x="82" y="614" class="body">Setup · access · OAuth</text>
  <text x="82" y="672" class="note">Browser over HTTPS</text>

  <text x="428" y="180" class="label">MCPLAMA GATEWAY</text>
  <rect x="422" y="202" width="552" height="508" rx="22" fill="#111a31" stroke="#806dff" stroke-width="2.5"/>
  <path d="M422 224Q422 202 444 202H952Q974 202 974 224V278H422Z" fill="url(#gateway)"/>
  <text x="456" y="252" class="heading">Backend API and MCP proxy</text>
  <text x="456" y="326" class="body">1  Authenticate the user and connection</text>
  <text x="456" y="374" class="body">2  Check grants and enforce policies</text>
  <text x="456" y="422" class="body">3  Apply upstream credentials</text>
  <text x="456" y="470" class="body">4  Record audit events</text>
  <text x="456" y="518" class="body">5  Proxy MCP requests</text>
  <rect x="456" y="558" width="484" height="104" rx="15" fill="#182744" stroke="#35476d" stroke-width="2"/>
  <text x="480" y="600" class="heading">No Docker socket</text>
  <text x="480" y="636" class="note">The backend never controls Docker directly.</text>

  <text x="1040" y="180" class="label">MCP SERVERS</text>
  <rect x="1034" y="202" width="312" height="196" rx="20" class="card"/>
  <text x="1062" y="248" class="heading">Remote servers</text>
  <text x="1062" y="292" class="body">HTTP MCP endpoint</text>
  <text x="1062" y="332" class="note">Reached by the backend</text>
  <text x="1062" y="362" class="note">URLs screened per request</text>

  <rect x="1034" y="438" width="312" height="272" rx="20" fill="#171d2a" stroke="#d09c53" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="1062" y="482" class="heading">Private Docker network</text>
  <text x="1062" y="526" class="body">Broker</text>
  <text x="1062" y="560" class="note">Only component with Docker access</text>
  <path d="M1062 584H1318" stroke="#37465d" stroke-width="2"/>
  <text x="1062" y="624" class="body">MCP containers</text>
  <text x="1062" y="662" class="note">No host socket; broker launches them</text>
  <text x="1062" y="692" class="note">Backend reaches them over this network</text>

  <path d="M354 320H422" class="flow"/>
  <path d="M354 594H390V680H422" class="flow"/>
  <path d="M974 320H1034" class="flow"/>
  <path d="M974 564H1004V526H1034" class="control"/>
  <text x="986" y="508" class="note">Start / stop</text>

  <rect x="54" y="772" width="1292" height="112" rx="20" fill="#10262e" stroke="#318c83" stroke-width="2"/>
  <text x="88" y="820" class="heading">PostgreSQL</text>
  <text x="310" y="820" class="body">Persistent state: users, servers, policies, connections, encrypted credentials, and audit logs</text>
  <path d="M698 710V772" fill="none" stroke="#46d3c2" stroke-width="4"/>
  <text x="56" y="920" class="note">Blue arrows: MCP and HTTP traffic</text>
  <path d="M380 912H430" class="control"/>
  <text x="450" y="920" class="note">Purple arrow: broker control request</text>
</svg>
